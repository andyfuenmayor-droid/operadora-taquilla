<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: transparent;
    color: #f8fafc;
    overflow: hidden;
  }
  .box {
    background: rgba(15, 23, 42, 0.95);
    border: 1px dashed rgba(56, 189, 248, 0.35);
    border-radius: 12px;
    padding: 10px;
  }
  canvas {
    background: #071217;
    border: 1px dashed rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    touch-action: none;
    cursor: crosshair;
    width: 100%;
    height: 125px;
    display: block;
  }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }
  .hint {
    font-size: 11px;
    color: #94a3b8;
  }
  button {
    background: rgba(244, 63, 94, 0.15);
    color: #f43f5e;
    border: 1px solid rgba(244, 63, 94, 0.3);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover {
    background: rgba(244, 63, 94, 0.3);
  }
</style>
</head>
<body>
<div class="box">
  <canvas id="sigCanvas"></canvas>
  <div class="controls">
    <span class="hint">✏️ Dibuje su firma en el recuadro usando su dedo, stylus o ratón</span>
    <button type="button" id="btnClear">🧹 Limpiar Firma</button>
  </div>
</div>

<script>
  function sendMessageToStreamlitClient(type, data) {
    var outData = Object.assign({
      isStreamlitMessage: true,
      type: type,
    }, data);
    window.parent.postMessage(outData, "*");
  }

  function setComponentValue(value) {
    sendMessageToStreamlitClient("streamlit:setComponentValue", {value: value});
  }

  function setFrameHeight(height) {
    sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: height});
  }

  // Streamlit lifecycle initialization
  window.addEventListener("message", function(event) {
    if (event.data && event.data.type === "streamlit:render") {
      setFrameHeight(175);
    }
  });

  sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});

  const canvas = document.getElementById('sigCanvas');
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let hasStrokes = false;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = 125;
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2.8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }
  window.addEventListener('resize', resizeCanvas);
  setTimeout(resizeCanvas, 40);

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    }
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    hasStrokes = true;
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }

  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  function autoSync() {
    if (hasStrokes) {
      const dataUrl = canvas.toDataURL('image/png');
      setComponentValue(dataUrl);
    } else {
      setComponentValue(null);
    }
  }

  function endDraw(e) {
    if (drawing) {
      drawing = false;
      ctx.closePath();
      autoSync();
    }
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);

  canvas.addEventListener('touchstart', startDraw, {passive: false});
  canvas.addEventListener('touchmove', draw, {passive: false});
  canvas.addEventListener('touchend', endDraw, {passive: false});

  document.getElementById('btnClear').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasStrokes = false;
    setComponentValue(null);
  });
</script>
</body>
</html>
